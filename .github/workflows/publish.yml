name: Publish npm package

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Validate package
        run: |
          npm run check
          npm test
          npm pack --dry-run

      - name: Check whether version already exists
        id: version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "number=$package_version" >> "$GITHUB_OUTPUT"

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm credentials
        if: steps.version.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::The NPM_TOKEN repository secret is missing or unavailable to this workflow."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org/

      - name: Publish to npm
        if: steps.version.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Write summary
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.exists }}" == "true" ]]; then
            echo "### npm publish skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${{ steps.version.outputs.name }}@${{ steps.version.outputs.number }}\` already exists on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### npm publish completed" >> "$GITHUB_STEP_SUMMARY"
            echo "Published \`${{ steps.version.outputs.name }}@${{ steps.version.outputs.number }}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
